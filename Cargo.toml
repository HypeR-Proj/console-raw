bin = [{name = "hyper-console-raw-system", path = "src/main.rs", test = false, bench = false}]

[package]
name = "hyper-console-raw-system"
version = "0.0.0"
edition = "2024"
license = "Apache-2.0"
repository = "https://github.com/HypeR-Proj/console-raw"
publish = false
autotests = false
workspace = "../../app"

[dependencies]

[dependencies.hyper-os]
workspace = true

[dependencies.hyper-rt]
version = "=0.0.0"
features = ["std"]

[dependencies.hyper-service]
workspace = true

[lints]

[lints.clippy]
doc_markdown = "deny"
empty_docs = "deny"
expect_used = "deny"
panic = "deny"
todo = "deny"
undocumented_unsafe_blocks = "deny"
unimplemented = "deny"
unreachable = "deny"
unwrap_used = "deny"
missing_safety_doc = "deny"

[lints.rust]
unsafe_op_in_unsafe_fn = "deny"

[lints.rust.unexpected_cfgs]
level = "warn"
check-cfg = ["cfg(target_os, values(\"hyper\"))"]

[lib]
name = "hyper_console_raw"
